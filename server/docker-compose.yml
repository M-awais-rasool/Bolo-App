services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bolo
      POSTGRES_PASSWORD: bolo
      POSTGRES_DB: bolo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolo -d bolo"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Audio clips + published content packs (S3-compatible, BACKEND_PLAN.md §2).
  # Not used by the identity module yet; here so M2 needs no compose changes.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bolo
      MINIO_ROOT_PASSWORD: bolo-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
